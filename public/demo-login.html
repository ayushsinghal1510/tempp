<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Login Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-card h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111;
    }
    .login-card p {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    .form-group input.highlight {
      border-color: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245,158,11,0.2);
      animation: pulse 0.6s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.01); }
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .login-btn:hover { background: #4338ca; }
    .login-btn:active { transform: scale(0.98); }
    .login-btn.highlight {
      background: #f59e0b;
      animation: pulse 0.6s ease-in-out;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 24px;
      color: #059669;
      font-weight: 600;
      font-size: 18px;
    }
    .success-msg.visible { display: block; }
    .form-content.hidden { display: none; }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #4f46e5;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="form-content" id="form-content">
      <h1>Welcome back</h1>
      <p>Sign in to your account to continue</p>
      <div class="form-group">
        <label for="username">Email or username</label>
        <input type="text" id="username" placeholder="Enter your email" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="off" />
      </div>
      <button class="login-btn" id="login-btn">Sign in</button>
      <a href="#" class="forgot-link" id="forgot-link">Forgot your password?</a>
    </div>
    <div class="success-msg" id="success-msg">
      ✓ Logged in successfully!
    </div>
  </div>

  <script>
    function sendAck(id, status, error) {
      window.parent.postMessage({ type: 'action_ack', id, status, error: error || null }, '*');
    }

    // Action executor — listens for postMessage commands from the parent frame.
    // IMPORTANT: ack is sent AFTER the action visually completes, not immediately.
    // The server blocks speech on the ack, so early acks cause actions to pile up.
    window.addEventListener('message', (event) => {
      const { action, id } = event.data;
      if (!action) return;

      try {
        switch (action.action) {
          case 'fill_field': {
            const el = document.querySelector(action.selector);
            if (!el) throw new Error(`Element not found: ${action.selector}`);
            el.classList.add('highlight');
            let i = 0;
            const val = action.value || '';
            el.value = '';
            const typeInterval = setInterval(() => {
              if (i < val.length) {
                el.value += val[i];
                i++;
              } else {
                clearInterval(typeInterval);
                setTimeout(() => {
                  el.classList.remove('highlight');
                  sendAck(id, 'ok');
                }, 400);
              }
            }, 60);
            break;
          }
          case 'click': {
            const el = document.querySelector(action.selector);
            if (!el) throw new Error(`Element not found: ${action.selector}`);
            el.classList.add('highlight');
            setTimeout(() => {
              el.click();
              el.classList.remove('highlight');
              sendAck(id, 'ok');
            }, 600);
            break;
          }
          case 'focus': {
            const el = document.querySelector(action.selector);
            if (!el) throw new Error(`Element not found: ${action.selector}`);
            el.classList.add('highlight');
            el.focus();
            setTimeout(() => {
              el.classList.remove('highlight');
              sendAck(id, 'ok');
            }, 800);
            break;
          }
          case 'scroll_to': {
            const el = document.querySelector(action.selector);
            if (!el) throw new Error(`Element not found: ${action.selector}`);
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => sendAck(id, 'ok'), 500);
            break;
          }
          default:
            sendAck(id, 'error', `Unknown action: ${action.action}`);
            return;
        }
      } catch (e) {
        sendAck(id, 'error', e.message);
      }
    });

    // Handle the login button click (simulates successful login)
    document.getElementById('login-btn').addEventListener('click', () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (username && password) {
        document.getElementById('form-content').classList.add('hidden');
        document.getElementById('success-msg').classList.add('visible');
      }
    });
  </script>
</body>
</html>
